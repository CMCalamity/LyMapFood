<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập Quản Trị - Lý Mập Food</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .bg-decor {
            position: absolute;
            border-radius: 9999px;
            filter: blur(60px);
            opacity: 0.35;
            z-index: 0;
        }

        .input-wrap:focus-within {
            border-color: #E0533C;
            box-shadow: 0 0 0 4px rgba(224,83,60,0.12);
        }

        .btn-primary {
            transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
        }

            .btn-primary:hover {
                transform: translateY(-1px);
                box-shadow: 0 10px 24px -6px rgba(224,83,60,0.45);
            }

            .btn-primary:active {
                transform: translateY(0);
            }

        .card-enter {
            animation: cardIn .5s ease both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-[#FFFBF2] text-[#2D2A26] min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Khối trang trí nền -->
    <div class="bg-decor bg-[#E0533C] w-72 h-72 -top-10 -left-10"></div>
    <div class="bg-decor bg-[#F2C14E] w-80 h-80 -bottom-16 -right-10"></div>

    <div class="relative z-10 w-full max-w-md card-enter">

        <!-- Thương hiệu phía trên thẻ -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#E0533C] to-[#c9432b] text-white font-black text-2xl flex items-center justify-center mx-auto shadow-lg shadow-[#E0533C]/30">
                LM
            </div>
            <p class="mt-3 text-[11px] font-bold tracking-[0.2em] text-[#2D2A26]/50 uppercase">Lý Mập Food · Internal System</p>
        </div>

        <!-- Thẻ đăng nhập -->
        <div class="bg-white/90 backdrop-blur p-8 rounded-3xl border border-black/5 shadow-[0_20px_50px_-15px_rgba(45,42,38,0.25)] space-y-6">

            <div class="space-y-1">
                <h1 class="text-2xl font-extrabold tracking-tight">Đăng nhập quản trị</h1>
                <p class="text-sm text-[#2D2A26]/60">Vui lòng đăng nhập để truy cập bảng điều khiển hệ thống.</p>
            </div>

            <div id="error-box" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-xs font-semibold text-center">
                Sai tài khoản hoặc mật khẩu! Mặc định: <strong>admin / 123456</strong>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-[#2D2A26]/70 mb-1.5">TÊN ĐĂNG NHẬP</label>
                    <div class="input-wrap flex items-center gap-2.5 bg-[#FFFBF2] rounded-xl border border-black/10 px-3.5 py-3 transition">
                        <i data-lucide="user" class="w-4 h-4 text-[#2D2A26]/50 shrink-0"></i>
                        <input id="txt-username" type="text" placeholder="admin"
                               class="w-full bg-transparent text-sm font-semibold placeholder:text-[#2D2A26]/30 focus:outline-none" required />
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-[#2D2A26]/70 mb-1.5">MẬT KHẨU</label>
                    <div class="input-wrap flex items-center gap-2.5 bg-[#FFFBF2] rounded-xl border border-black/10 px-3.5 py-3 transition">
                        <i data-lucide="lock" class="w-4 h-4 text-[#2D2A26]/50 shrink-0"></i>
                        <input id="txt-password" type="password" placeholder="••••••••"
                               class="w-full bg-transparent text-sm font-semibold placeholder:text-[#2D2A26]/30 focus:outline-none" required />
                        <button type="button" onclick="togglePassword()" class="shrink-0">
                            <i id="eye-icon" data-lucide="eye" class="w-4 h-4 text-[#2D2A26]/40"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 font-semibold text-[#2D2A26]/70 cursor-pointer">
                        <input type="checkbox" class="rounded border-black/20 accent-[#E0533C]" />
                        Ghi nhớ đăng nhập
                    </label>
                    <a href="#" onclick="alert('Mật khẩu mặc định là: 123456')" class="font-semibold text-[#E0533C] hover:underline">Quên mật khẩu?</a>
                </div>

                <button type="submit"
                        class="btn-primary w-full bg-[#E0533C] text-white font-bold py-3.5 rounded-xl text-sm tracking-wide flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Đăng nhập hệ thống
                </button>
            </form>

            <div class="pt-4 border-t border-black/5 text-center">
                <a href="/index.html" class="text-xs font-semibold text-[#2D2A26]/50 hover:text-[#E0533C] transition inline-flex items-center gap-1">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                    Quay lại trang chủ khách hàng
                </a>
            </div>
        </div>

        <p class="text-center text-[11px] text-[#2D2A26]/40 font-medium mt-6">
            © 2026 Lý Mập Food · MeU Solutions Internal Tools
        </p>
    </div>

    <script>
        lucide.createIcons();

        function togglePassword() {
            const input = document.getElementById('txt-password');
            const icon = document.getElementById('eye-icon');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.setAttribute('data-lucide', isHidden ? 'eye-off' : 'eye');
            lucide.createIcons();
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('txt-username').value.trim();
            const p = document.getElementById('txt-password').value.trim();
            const err = document.getElementById('error-box');

            if (u === 'admin' && p === '123456') {
                localStorage.setItem('admin_logged_in', 'true');
                window.location.replace('/Admin/Index.html');
            } else {
                err.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
