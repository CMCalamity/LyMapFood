<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Trị Hệ Thống - Lý Mập Food</title>
    <script>
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            alert('Bạn chưa đăng nhập quyền Admin!');
            window.location.replace('/Admin/Login.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 font-['Plus_Jakarta_Sans'] text-slate-800">

    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#2D2A26] text-white p-6 space-y-6 flex flex-col justify-between shrink-0">
            <div class="space-y-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-[#E0533C] text-white font-black text-xl flex items-center justify-center">LM</div>
                    <span class="font-black text-lg">LÝ MẬP ADMIN</span>
                </div>

                <nav class="space-y-2 text-sm font-bold">
                    <a href="/Admin/Index.html" class="flex items-center gap-3 bg-[#E0533C] text-white p-3 rounded-xl">
                        <i data-lucide="package" class="w-5 h-5"></i>
                        <span>Quản Lý Sản Phẩm</span>
                    </a>
                    <a href="/Admin/Orders.html" class="flex items-center gap-3 hover:bg-slate-800 p-3 rounded-xl transition">
                        <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                        <span>Quản Lý Đơn Hàng</span>
                    </a>
                    <a href="/index.html" target="_blank" class="flex items-center gap-3 hover:bg-slate-800 p-3 rounded-xl transition text-amber-400">
                        <i data-lucide="external-link" class="w-5 h-5"></i>
                        <span>Xem Trang Khách</span>
                    </a>
                    <button onclick="logoutAdmin()" class="w-full flex items-center gap-3 hover:bg-red-900/50 text-red-400 p-3 rounded-xl transition text-left mt-4">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                        <span>Đăng Xuất</span>
                    </button>
                </nav>
            </div>

            <div class="text-xs text-slate-400">
                Logged in as: <strong>Admin Lý Mập</strong>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 space-y-6">
            <div class="flex justify-between items-center bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div>
                    <h1 class="text-2xl font-black text-slate-900">QUẢN LÝ THỰC ĐƠN & KHUYẾN MÃI</h1>
                    <p class="text-xs font-semibold text-slate-500 mt-1">Chỉnh sửa giá, bật giảm giá và xóa món trực tiếp</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="resetDefaultMenu()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl border text-xs">
                        Khôi Phục Gốc
                    </button>
                    <a href="/Admin/Create.html" class="bg-[#E0533C] hover:bg-[#c9432b] text-white font-black px-5 py-2.5 rounded-xl border-2 border-[#2D2A26] shadow-[2px_2px_0px_0px_#2D2A26] flex items-center gap-2 text-xs">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>THÊM MÓN MỚI</span>
                    </a>
                </div>
            </div>

            <!-- Bảng Sản Phẩm -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-black text-slate-600 uppercase">
                            <th class="p-4">Hình Ảnh</th>
                            <th class="p-4">Tên Sản Phẩm</th>
                            <th class="p-4">Giá Gốc</th>
                            <th class="p-4">Khuyến Mãi</th>
                            <th class="p-4">Giá Thực Tế</th>
                            <th class="p-4 text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="menu-table-body" class="divide-y divide-slate-100 text-sm font-semibold">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL CHỈNH KHUYẾN MÃI -->
    <div id="promo-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 border-2 border-slate-800 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-base font-black text-slate-900" id="promo-modal-title">Cài Đặt Khuyến Mãi</h3>
                <button onclick="closePromoModal()" class="text-slate-400 hover:text-black font-bold">✕</button>
            </div>
            <input type="hidden" id="promo-item-id" />

            <div class="space-y-3">
                <label class="flex items-center gap-2 cursor-pointer bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <input type="checkbox" id="promo-enable" class="w-4 h-4 text-[#E0533C] rounded focus:ring-0" />
                    <span class="text-xs font-black text-slate-800">BẬT GIẢM GIÁ MÓN NÀY</span>
                </label>

                <div>
                    <label class="block text-xs font-black mb-1">MỨC GIẢM (%):</label>
                    <input type="number" id="promo-percent" min="1" max="90" placeholder="VD: 20" class="w-full bg-slate-50 p-3 rounded-xl border border-slate-300 text-xs font-bold focus:outline-none focus:border-[#E0533C]" />
                </div>

                <div>
                    <label class="block text-xs font-black mb-1">NHÃN SALE NGOÀI TRANG CHỦ:</label>
                    <input type="text" id="promo-note" placeholder="VD: SALE 20%, GIỜ VÀNG..." class="w-full bg-slate-50 p-3 rounded-xl border border-slate-300 text-xs font-bold focus:outline-none focus:border-[#E0533C]" />
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closePromoModal()" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-800">Hủy</button>
                <button onclick="savePromoModal()" class="px-5 py-2.5 bg-[#E0533C] text-white rounded-xl text-xs font-black shadow-md hover:bg-[#c9432b] transition">Lưu Khuyến Mãi</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_PRODUCTS = [
            { id: 1, title: "Sữa Đậu Nành Tươi", price: 10000, calo: 120, img: "https://images.unsplash.com/photo-1528750997573-59b89d56f4f7?auto=format&fit=crop&w=600&q=80", status: "Đang Bán", isOnSale: true, discountPercent: 20, saleNote: "GIẢM 20%" },
            { id: 2, title: "Sữa Bắp Tươi", price: 15000, calo: 160, img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=600&q=80", status: "Đang Bán", isOnSale: false, discountPercent: 0, saleNote: "" },
            { id: 3, title: "Sữa Đậu Đỏ", price: 15000, calo: 140, img: "https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=600&q=80", status: "Đang Bán", isOnSale: false, discountPercent: 0, saleNote: "" },
            { id: 4, title: "Cơm Cháy Chà Bông", price: 35000, calo: 380, img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=80", status: "Đang Bán", isOnSale: true, discountPercent: 10, saleNote: "ƯU ĐÃI HÈ" },
            { id: 5, title: "Cơm Cháy Mắm Hành", price: 30000, calo: 320, img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80", status: "Đang Bán", isOnSale: false, discountPercent: 0, saleNote: "" },
            { id: 6, title: "Thạch Lá Nếp & Trân Châu", price: 5000, calo: 60, img: "https://images.unsplash.com/photo-1558857563-b371033873b8?auto=format&fit=crop&w=600&q=80", status: "Đang Bán", isOnSale: false, discountPercent: 0, saleNote: "" }
        ];

        function getProducts() {
            const data = localStorage.getItem('lymap_products');
            if (!data) {
                localStorage.setItem('lymap_products', JSON.stringify(DEFAULT_PRODUCTS));
                return DEFAULT_PRODUCTS;
            }
            return JSON.parse(data);
        }

        function renderAdminMenu() {
            const products = getProducts();
            const tbody = document.getElementById('menu-table-body');
            tbody.innerHTML = '';

            products.forEach(p => {
                const numericPrice = typeof p.price === 'string' ? parseInt(p.price.replace(/\D/g, '')) || 0 : p.price;
                const isOnSale = p.isOnSale && p.discountPercent > 0;
                const finalPrice = isOnSale ? numericPrice * (100 - p.discountPercent) / 100 : numericPrice;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition";
                tr.innerHTML = `
                        <td class="p-4">
                            <img src="${p.img}" class="w-12 h-12 rounded-xl object-cover border border-slate-200" />
                        </td>
                        <td class="p-4 font-black text-slate-900">${p.title}</td>
                        <td class="p-4 font-bold text-slate-500">${numericPrice.toLocaleString('vi-VN')} ₫</td>
                        <td class="p-4">
                            ${isOnSale
                        ? `<span class="bg-red-100 text-red-700 text-xs px-2.5 py-1 rounded-full font-bold">Giảm ${p.discountPercent}% (${p.saleNote || 'Sale'})</span>`
                        : `<span class="text-xs text-slate-400 font-bold">Không giảm</span>`}
                        </td>
                        <td class="p-4 text-[#E0533C] font-black">${finalPrice.toLocaleString('vi-VN')} ₫</td>
                        <td class="p-4 text-center space-x-2">
                            <button onclick="openPromoModal(${p.id})" class="bg-amber-50 hover:bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg text-xs font-bold border border-amber-200">Khuyến Mãi</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-200">Xóa</button>
                        </td>
                    `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function openPromoModal(id) {
            const products = getProducts();
            const p = products.find(x => x.id === id);
            if (!p) return;

            document.getElementById('promo-item-id').value = p.id;
            document.getElementById('promo-modal-title').innerText = `Khuyến Mãi: ${p.title}`;
            document.getElementById('promo-enable').checked = !!p.isOnSale;
            document.getElementById('promo-percent').value = p.discountPercent || '';
            document.getElementById('promo-note').value = p.saleNote || '';

            document.getElementById('promo-modal').classList.remove('hidden');
        }

        function closePromoModal() {
            document.getElementById('promo-modal').classList.add('hidden');
        }

        function savePromoModal() {
            const id = parseInt(document.getElementById('promo-item-id').value);
            const enable = document.getElementById('promo-enable').checked;
            const percent = parseInt(document.getElementById('promo-percent').value) || 0;
            const note = document.getElementById('promo-note').value.trim();

            let products = getProducts();
            products = products.map(p => {
                if (p.id === id) {
                    return {
                        ...p,
                        isOnSale: enable,
                        discountPercent: enable ? percent : 0,
                        saleNote: enable ? (note || `GIẢM ${percent}%`) : ''
                    };
                }
                return p;
            });

            localStorage.setItem('lymap_products', JSON.stringify(products));
            closePromoModal();
            renderAdminMenu();
            alert('Đã cập nhật khuyến mãi thành công!');
        }

        function deleteProduct(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa món này khỏi menu không?')) return;
            let products = getProducts();
            products = products.filter(p => p.id !== id);
            localStorage.setItem('lymap_products', JSON.stringify(products));
            renderAdminMenu();
        }

        function resetDefaultMenu() {
            if (!confirm('Khôi phục danh sách đầy đủ 6 món ban đầu?')) return;
            localStorage.setItem('lymap_products', JSON.stringify(DEFAULT_PRODUCTS));
            renderAdminMenu();
        }

        function logoutAdmin() {
            localStorage.removeItem('admin_logged_in');
            alert('Đã đăng xuất!');
            window.location.replace('/Admin/Login.html');
        }

        document.addEventListener('DOMContentLoaded', renderAdminMenu);
    </script>
</body>
</html>
