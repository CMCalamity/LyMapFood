<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sửa Sản Phẩm - Admin Lý Mập</title>
    <script>
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.replace('/Admin/Login.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 font-['Plus_Jakarta_Sans'] p-8 text-slate-800">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-3xl border-2 border-[#2D2A26] shadow-[6px_6px_0px_0px_#2D2A26] space-y-6">
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-black text-[#2D2A26]">CHỈNH SỬA SẢN PHẨM & DINH DƯỠNG</h1>
            <a href="/Admin/Index.html" class="text-xs font-bold text-slate-500 hover:text-black">← Quay lại danh sách</a>
        </div>

        <form onsubmit="handleSaveEdit(event)" class="space-y-4">
            <input type="hidden" id="edit-id" />

            <div>
                <label class="block text-xs font-black mb-1">TÊN SẢN PHẨM:</label>
                <input type="text" id="edit-name" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-black mb-1">DANH MỤC:</label>
                    <input list="category-list" id="edit-category" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
                    <datalist id="category-list">
                        <option value="Sữa Tươi">
                        <option value="Cơm Cháy">
                        <option value="Topping">
                        <option value="Trà Trái Cây">
                        <option value="Ăn Vặt">
                    </datalist>
                </div>
                <div>
                    <label class="block text-xs font-black mb-1">GIÁ BÁN (VNĐ):</label>
                    <input type="number" id="edit-price" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-black mb-1">CALO (KCAL):</label>
                    <input type="number" id="edit-calo" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" />
                </div>
                <div>
                    <label class="block text-xs font-black mb-1">ĐIỂM HEALTHY (/10):</label>
                    <input type="text" id="edit-score" placeholder="VD: 9.6" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" />
                </div>
            </div>

            <!-- Nhóm chỉ số dinh dưỡng cho Modal -->
            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                <span class="text-xs font-black text-slate-800 block">CHỈ SỐ DINH DƯỠNG (HIỂN THỊ POPUP):</span>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold mb-1">PROTEIN (g):</label>
                        <input type="text" id="edit-protein" placeholder="VD: 6.8g" class="w-full bg-white p-2.5 rounded-xl border border-slate-300 text-xs font-bold" />
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold mb-1">CARBS (g):</label>
                        <input type="text" id="edit-carbs" placeholder="VD: 12.5g" class="w-full bg-white p-2.5 rounded-xl border border-slate-300 text-xs font-bold" />
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold mb-1">FAT (g):</label>
                        <input type="text" id="edit-fat" placeholder="VD: 3.2g" class="w-full bg-white p-2.5 rounded-xl border border-slate-300 text-xs font-bold" />
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-black mb-1">NGUYÊN LIỆU:</label>
                <textarea id="edit-ingredients" rows="2" placeholder="VD: 100% đậu nành tự nhiên, lá dứa..." class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]"></textarea>
            </div>

            <div>
                <label class="block text-xs font-black mb-1">TÁC DỤNG / LỢI ÍCH:</label>
                <textarea id="edit-benefits" rows="2" placeholder="VD: Bổ sung năng lượng, đẹp da..." class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]"></textarea>
            </div>

            <div>
                <label class="block text-xs font-black mb-1">LINK HÌNH ẢNH (URL):</label>
                <input type="text" id="edit-image" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" />
            </div>

            <!-- Khuyến mãi -->
            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="edit-sale" class="w-4 h-4 text-[#E0533C] rounded focus:ring-0" />
                    <span class="text-xs font-black text-slate-800">ÁP DỤNG GIẢM GIÁ</span>
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="edit-discount" placeholder="% Giảm (VD: 20)" min="1" max="90" class="bg-white p-2.5 rounded-xl border border-slate-300 text-xs font-bold" />
                    <input type="text" id="edit-salenote" placeholder="Nhãn Sale (VD: GIẢM 20%)" class="bg-white p-2.5 rounded-xl border border-slate-300 text-xs font-bold" />
                </div>
            </div>

            <button type="submit" class="w-full bg-[#E0533C] hover:bg-[#c9432b] text-white font-black py-3.5 rounded-xl border-2 border-[#2D2A26] shadow-[3px_3px_0px_0px_#2D2A26] transition text-xs tracking-wider uppercase">
                LƯU CẬP NHẬT TẤT CẢ
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));

            const stored = localStorage.getItem('lymap_products');
            const products = stored ? JSON.parse(stored) : [];
            const item = products.find(p => p.id === productId);

            if (!item) {
                alert('Không tìm thấy món ăn này!');
                window.location.href = '/Admin/Index.html';
                return;
            }

            const numPrice = typeof item.price === 'string' ? parseInt(item.price.replace(/\D/g, '')) || 0 : item.price;

            document.getElementById('edit-id').value = item.id;
            document.getElementById('edit-name').value = item.title || '';
            document.getElementById('edit-category').value = item.category || 'Sữa Tươi';
            document.getElementById('edit-price').value = numPrice;
            document.getElementById('edit-calo').value = item.calo || 100;
            document.getElementById('edit-score').value = item.score || '9.5';
            document.getElementById('edit-protein').value = item.protein || '5.5g';
            document.getElementById('edit-carbs').value = item.carbs || '18.0g';
            document.getElementById('edit-fat').value = item.fat || '3.5g';
            document.getElementById('edit-ingredients').value = item.ingredients || '';
            document.getElementById('edit-benefits').value = item.benefits || '';
            document.getElementById('edit-image').value = item.img || '';

            document.getElementById('edit-sale').checked = !!item.isOnSale;
            document.getElementById('edit-discount').value = item.discountPercent || '';
            document.getElementById('edit-salenote').value = item.saleNote || '';
        });

        function handleSaveEdit(e) {
            e.preventDefault();

            const id = parseInt(document.getElementById('edit-id').value);
            const title = document.getElementById('edit-name').value.trim();
            const category = document.getElementById('edit-category').value.trim();
            const price = parseInt(document.getElementById('edit-price').value) || 0;
            const calo = parseInt(document.getElementById('edit-calo').value) || 100;
            const score = document.getElementById('edit-score').value.trim() || '9.5';
            const protein = document.getElementById('edit-protein').value.trim() || '5.5g';
            const carbs = document.getElementById('edit-carbs').value.trim() || '18.0g';
            const fat = document.getElementById('edit-fat').value.trim() || '3.5g';
            const ingredients = document.getElementById('edit-ingredients').value.trim();
            const benefits = document.getElementById('edit-benefits').value.trim();
            let img = document.getElementById('edit-image').value.trim();
            if (!img) {
                img = "https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=600&q=80";
            }

            const isOnSale = document.getElementById('edit-sale').checked;
            const discountPercent = parseInt(document.getElementById('edit-discount').value) || 0;
            const saleNote = document.getElementById('edit-salenote').value.trim() || (isOnSale ? `GIẢM ${discountPercent}%` : '');

            const stored = localStorage.getItem('lymap_products');
            let products = stored ? JSON.parse(stored) : [];

            products = products.map(p => {
                if (p.id === id) {
                    return {
                        ...p,
                        title,
                        category,
                        price,
                        calo,
                        score,
                        protein,
                        carbs,
                        fat,
                        ingredients,
                        benefits,
                        img,
                        isOnSale,
                        discountPercent: isOnSale ? discountPercent : 0,
                        saleNote: isOnSale ? saleNote : ''
                    };
                }
                return p;
            });

            localStorage.setItem('lymap_products', JSON.stringify(products));
            alert('Đã cập nhật toàn bộ thông tin món ăn thành công!');
            window.location.href = '/Admin/Index.html';
        }
    </script>
</body>
</html>
