<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sửa Sản Phẩm - Admin Lý Mập</title>
    <!-- BẢO VỆ ĐĂNG NHẬP -->
    <script>
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.replace('/Admin/Login.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 font-['Plus_Jakarta_Sans'] p-8 text-slate-800">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-3xl border-2 border-[#2D2A26] shadow-[6px_6px_0px_0px_#2D2A26] space-y-6">
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-black text-[#2D2A26]">CHỈNH SỬA SẢN PHẨM</h1>
            <a href="/Admin/Index.html" class="text-xs font-bold text-slate-500 hover:text-black">← Quay lại danh sách</a>
        </div>

        <form onsubmit="handleSaveEdit(event)" class="space-y-4">
            <input type="hidden" id="edit-id" value="1" />

            <div>
                <label class="block text-xs font-black mb-1">TÊN SẢN PHẨM:</label>
                <input type="text" id="edit-name" value="Sữa Đậu Nành Tươi" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-black mb-1">GIÁ BÁN (ĐỒNG):</label>
                    <input type="number" id="edit-price" value="15000" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
                </div>
                <div>
                    <label class="block text-xs font-black mb-1">CALO (KCAL):</label>
                    <input type="number" id="edit-calo" value="120" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
                </div>
            </div>

            <div>
                <label class="block text-xs font-black mb-1">LINK HÌNH ẢNH (URL):</label>
                <input type="text" id="edit-image" value="https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?auto=format&fit=crop&w=600&q=80" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
            </div>

            <button type="submit" class="w-full bg-[#E0533C] hover:bg-[#c9432b] text-white font-black py-3.5 rounded-xl border-2 border-[#2D2A26] shadow-[3px_3px_0px_0px_#2D2A26] transition text-xs tracking-wider uppercase">
                LƯU CẬP NHẬT
            </button>
        </form>
    </div>

    <script>
        function handleSaveEdit(e) {
            e.preventDefault();
            const name = document.getElementById('edit-name').value;
            alert('Cập nhật thành công cho món: ' + name);
            window.location.href = '/Admin/Index.html';
        }
    </script>
</body>
</html>
