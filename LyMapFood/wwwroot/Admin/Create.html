<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm Sản Phẩm - Admin Lý Mập</title>
    <script>
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.replace('/Admin/Login.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 font-['Plus_Jakarta_Sans'] p-8 text-slate-800">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-3xl border-2 border-[#2D2A26] shadow-[6px_6px_0px_0px_#2D2A26] space-y-6">
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-black text-[#2D2A26]">THÊM MÓN MỚI VÀO MENU</h1>
            <a href="/Admin/Index.html" class="text-xs font-bold text-slate-500 hover:text-black">← Quay lại danh sách</a>
        </div>

        <form onsubmit="handleCreateProduct(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-black mb-1">TÊN SẢN PHẨM:</label>
                <input type="text" id="new-name" placeholder="VD: Trà Dâu Tươi Tây Bắc" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-black mb-1">DANH MỤC (CHỌN HOẶC GÕ MỚI):</label>
                    <!-- Cho phép chọn có sẵn hoặc gõ danh mục mới thoải mái -->
                    <input list="category-list" id="new-category" placeholder="Chọn hoặc nhập danh mục mới" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
                    <datalist id="category-list">
                        <option value="Sữa Tươi">
                        <option value="Cơm Cháy">
                        <option value="Topping">
                        <option value="Trà Trái Cây">
                        <option value="Ăn Vặt">
                    </datalist>
                </div>
                <div>
                    <label class="block text-xs font-black mb-1">GIÁ BÁN (VNĐ):</label>
                    <input type="number" id="new-price" placeholder="VD: 25000" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" required />
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-black mb-1">CALO (KCAL):</label>
                    <input type="number" id="new-calo" placeholder="VD: 120" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" />
                </div>
                <div>
                    <label class="block text-xs font-black mb-1">LINK HÌNH ẢNH (BỎ TRỐNG NẾU CHƯA CÓ):</label>
                    <input type="text" id="new-img" placeholder="https://... (Không bắt buộc)" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]" />
                </div>
            </div>

            <div>
                <label class="block text-xs font-black mb-1">MÔ TẢ NGẮN:</label>
                <textarea id="new-desc" rows="2" placeholder="VD: Hương vị thơm ngon thanh mát tự nhiên..." class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold focus:outline-none focus:border-[#E0533C]"></textarea>
            </div>

            <!-- Cài khuyến mãi lúc tạo -->
            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="new-sale" class="w-4 h-4 text-[#E0533C] rounded focus:ring-0" />
                    <span class="text-xs font-black text-slate-800">ÁP DỤNG KHUYẾN MÃI NGAY KHI TẠO</span>
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="new-discount" placeholder="% Giảm (VD: 20)" min="1" max="90" class="bg-white p-2.5 rounded-xl border border-slate-300 text-xs font-bold" />
                    <input type="text" id="new-salenote" placeholder="Nhãn Sale (VD: SALE 20%)" class="bg-white p-2.5 rounded-xl border border-slate-300 text-xs font-bold" />
                </div>
            </div>

            <button type="submit" class="w-full bg-[#10B981] hover:bg-[#059669] text-white font-black py-3.5 rounded-xl border-2 border-[#2D2A26] shadow-[3px_3px_0px_0px_#2D2A26] transition text-xs tracking-wider uppercase">
                TẠO MÓN MỚI VÀ ĐỒNG BỘ
            </button>
        </form>
    </div>

    <script>
        function handleCreateProduct(e) {
            e.preventDefault();

            const title = document.getElementById('new-name').value.trim();
            const rawCategory = document.getElementById('new-category').value.trim();
            const price = parseInt(document.getElementById('new-price').value) || 0;
            const calo = parseInt(document.getElementById('new-calo').value) || 100;
            let img = document.getElementById('new-img').value.trim();

            // Ảnh mặc định nếu người dùng không điền link ảnh
            if (!img) {
                img = "https://images.unsplash.com/photo-1544787219-7f47ccb76574?auto=format&fit=crop&w=600&q=80";
            }

            const desc = document.getElementById('new-desc').value.trim() || 'Hương vị thơm ngon, tự nhiên mỗi ngày.';

            const isOnSale = document.getElementById('new-sale').checked;
            const discountPercent = parseInt(document.getElementById('new-discount').value) || 0;
            const saleNote = document.getElementById('new-salenote').value.trim() || (isOnSale ? `GIẢM ${discountPercent}%` : '');

            const stored = localStorage.getItem('lymap_products');
            let products = stored ? JSON.parse(stored) : [];

            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;

            const newProduct = {
                id: newId,
                title: title,
                category: rawCategory,
                price: price,
                calo: calo,
                img: img,
                desc: desc,
                status: "Đang Bán",
                isOnSale: isOnSale,
                discountPercent: isOnSale ? discountPercent : 0,
                saleNote: saleNote,
                batch: "Mới ra lò",
                sold: "Mới"
            };

            products.push(newProduct);
            localStorage.setItem('lymap_products', JSON.stringify(products));

            alert('Đã thêm món "' + title + '" vào danh mục [' + rawCategory + '] thành công!');
            window.location.href = '/Admin/Index.html';
        }
    </script>
</body>
</html>
