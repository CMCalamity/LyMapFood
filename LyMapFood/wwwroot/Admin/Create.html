<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thêm Sản Phẩm - Admin Lý Mập</title>
    <script>
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.replace('/Admin/Login.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 font-['Plus_Jakarta_Sans'] p-8 text-slate-800">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-3xl border-2 border-[#2D2A26] shadow-[6px_6px_0px_0px_#2D2A26] space-y-6">
        <div class="flex justify-between items-center border-b pb-4">
            <h1 class="text-2xl font-black text-[#2D2A26]">THÊM MÓN MỚI VÀO MENU</h1>
            <a href="/Admin/Index.html" class="text-xs font-bold text-slate-500 hover:text-black">← Quay lại</a>
        </div>

        <form onsubmit="event.preventDefault(); alert('Đã thêm món mới thành công!'); window.location.href='/Admin/Index.html';" class="space-y-4">
            <div>
                <label class="block text-xs font-black mb-1">TÊN SẢN PHẨM:</label>
                <input type="text" placeholder="VD: Sữa Đậu Nành Matcha" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold" required />
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-black mb-1">GIÁ BÁN (VNĐ):</label>
                    <input type="number" placeholder="VD: 20000" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold" required />
                </div>
                <div>
                    <label class="block text-xs font-black mb-1">CALO (KCAL):</label>
                    <input type="number" placeholder="VD: 150" class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold" required />
                </div>
            </div>
            <div>
                <label class="block text-xs font-black mb-1">LINK HÌNH ẢNH (URL):</label>
                <input type="text" placeholder="https://..." class="w-full bg-[#FFFBF2] p-3 rounded-xl border-2 border-[#2D2A26] text-xs font-bold" required />
            </div>
            <button type="submit" class="w-full bg-[#10B981] text-white font-black py-3.5 rounded-xl border-2 border-[#2D2A26] shadow-[3px_3px_0px_0px_#2D2A26]">TẠO MÓN MỚI</button>
        </form>
    </div>
</body>
</html>
